name: Publish tuzzy image

# Builds Dockerfile and pushes it to GHCR as ghcr.io/toon-protocol/tuzzy.
#
# ON TAGS AND MANUAL RUNS ONLY, not on every push to main. An operator pins this
# image beside a crawler they are keeping alive; a tag is a thing they can choose
# to move to, and a floating tag that follows main is a thing that moves under
# them. `latest` therefore tracks the newest vX.Y.Z, never a branch.
#
# `type=sha` is what a rollback pins to: it is the only tag here that cannot be
# made to mean a different image later.
#
# Two architectures because they are free: the dependency closure is pure
# JavaScript (the build asserts it -- see Dockerfile stage 1), so there is nothing
# to cross-compile, and an operator's box is as likely to be arm64 as amd64.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: publish-image-${{ github.ref }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tuzzy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
